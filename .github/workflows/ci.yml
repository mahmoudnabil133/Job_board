name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/job_board-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/job_board-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, zip, dom, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist
        working-directory: api

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: api

      - name: Run tests
        run: php artisan test
        working-directory: api

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript check
        run: npm run lint
        working-directory: web

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 3.90.150.15
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker.io docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # Ensure repo exists
            if [ ! -d "/opt/hireitian/.git" ]; then
              sudo mkdir -p /opt/hireitian
              sudo chown ubuntu:ubuntu /opt/hireitian
              git clone https://github.com/${{ github.repository }}.git /opt/hireitian
            fi

            cd /opt/hireitian

            # Pull latest code
            git fetch origin main
            git checkout main
            git pull origin main

            # Save existing APP_KEY if any
            if [ -f "api/.env" ]; then
              OLD_KEY=$(grep '^APP_KEY=' api/.env | head -1 | cut -d= -f2-)
            fi

            # Always write fresh .env (previous ones may be corrupted from failed deploys)
            printf '%s\n' \
                'APP_NAME=HireITIan' \
                'APP_ENV=production' \
                'APP_KEY=' \
                'APP_DEBUG=false' \
                'APP_URL=http://3.90.150.15' \
                'APP_LOCALE=en' \
                'APP_FALLBACK_LOCALE=en' \
                'APP_FAKER_LOCALE=en_US' \
                'APP_MAINTENANCE_DRIVER=file' \
                'BCRYPT_ROUNDS=12' \
                'LOG_CHANNEL=stack' \
                'LOG_STACK=single' \
                'LOG_DEPRECATIONS_CHANNEL=null' \
                'LOG_LEVEL=error' \
                'DB_CONNECTION=mysql' \
                'DB_HOST=db' \
                'DB_PORT=3306' \
                'DB_DATABASE=hireitian' \
                'DB_USERNAME=hireitian' \
                'DB_PASSWORD=secret' \
                'SESSION_DRIVER=database' \
                'SESSION_LIFETIME=120' \
                'SESSION_ENCRYPT=false' \
                'SESSION_PATH=/' \
                'SESSION_DOMAIN=null' \
                'BROADCAST_CONNECTION=log' \
                'FILESYSTEM_DISK=local' \
                'QUEUE_CONNECTION=database' \
                'CACHE_STORE=database' \
                'MAIL_MAILER=log' \
                'MAIL_HOST=127.0.0.1' \
                'MAIL_PORT=2525' \
                'MAIL_USERNAME=null' \
                'MAIL_PASSWORD=null' \
                'MAIL_FROM_ADDRESS="hello@example.com"' \
                'MAIL_FROM_NAME="HireITIan"' \
                'AWS_ACCESS_KEY_ID=' \
                'AWS_SECRET_ACCESS_KEY=' \
                'AWS_DEFAULT_REGION=us-east-1' \
                'AWS_BUCKET=' \
                'AWS_USE_PATH_STYLE_ENDPOINT=false' \
                > api/.env

            # Restore previous APP_KEY or generate a new one
            if [ -n "$OLD_KEY" ]; then
              printf 'APP_KEY=%s\n' "$OLD_KEY" >> api/.env
            else
              APP_KEY="base64:$(openssl rand -base64 32)"
              printf 'APP_KEY=%s\n' "$APP_KEY" >> api/.env
            fi
            fi

            # Login to ghcr.io
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and start containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Generate app key if missing
            docker compose -f docker-compose.prod.yml exec -T backend php artisan key:generate --force || true

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force

            # Cache config
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
