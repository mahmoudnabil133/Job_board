name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/job_board-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/job_board-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, zip, dom, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist
        working-directory: api

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: api

      - name: Run tests
        run: php artisan test
        working-directory: api

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript check
        run: npm run lint
        working-directory: web

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 3.90.150.15
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker.io docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # Ensure repo exists
            if [ ! -d "/opt/hireitian/.git" ]; then
              sudo mkdir -p /opt/hireitian
              sudo chown ubuntu:ubuntu /opt/hireitian
              git clone https://github.com/${{ github.repository }}.git /opt/hireitian
            fi

            cd /opt/hireitian

            # Pull latest code
            git fetch origin main
            git checkout main
            git pull origin main

            # Create .env from example if not exists
            if [ ! -f "api/.env" ]; then
              cp api/.env.example api/.env
              sed -i 's/DB_HOST=.*/DB_HOST=db/' api/.env
              sed -i 's/DB_DATABASE=.*/DB_DATABASE=hireitian/' api/.env
              sed -i 's/DB_USERNAME=.*/DB_USERNAME=hireitian/' api/.env
              sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' api/.env
              echo ">>> .env created with Docker defaults"
            fi

            # Login to ghcr.io
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and start containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Generate app key if missing
            docker compose -f docker-compose.prod.yml exec -T backend php artisan key:generate --force || true

            # Run migrations
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force

            # Cache config
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache
