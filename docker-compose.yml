services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jobboard_api
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"  # This exposes your API directly to http://localhost:8000
    volumes:
      - ./api:/var/www
      - /var/www/vendor
    depends_on:
      - db
    networks:
      - jobboard

  web:
    image: node:20-slim
    container_name: jobboard_web
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:5173"  # Your frontend will be at http://localhost:3000
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "rm -rf node_modules/* node_modules/.[!.]* && npm install && npm run dev"
    networks:
      - jobboard

  db:
    image: mysql:8.0
    container_name: jobboard_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_board
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jobboard

volumes:
  db_data:

networks:
  jobboard:
    driver: bridge