version: '3.9'

services:
  backend:
    build:
      context: ./api
    container_name: laravel_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www
    working_dir: /var/www
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./web
    container_name: react_web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    command: npm run dev -- --host

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: hireitian
      MYSQL_ROOT_PASSWORD: 123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: