services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jobboard_api
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www
      - /var/www/vendor
    command: php -S 0.0.0.0:8000 -t public    # ← Use PHP built-in server, not artisan
    depends_on:
      - db
    networks:
      - jobboard

  web:
    image: node:22-alpine
    container_name: jobboard_web
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev"
    networks:
      - jobboard

  db:
    image: mysql:8.0
    container_name: jobboard_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_board
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jobboard

volumes:
  db_data:

networks:
  jobboard:
    driver: bridge