version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jobboard_api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./api:/var/www
      - /var/www/vendor
    depends_on:
      - db
    networks:
      - jobboard

  nginx:
    image: nginx:alpine
    container_name: jobboard_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - jobboard

  web:
    image: node:18-alpine
    container_name: jobboard_web
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev"
    networks:
      - jobboard

  db:
    image: mysql:8.0
    container_name: jobboard_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_board
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jobboard

volumes:
  db_data:

networks:
  jobboard:
    driver: bridge